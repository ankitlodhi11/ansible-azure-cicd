- name: Get Azure VM Public IP
  run: |
    VM_IP=$(az vm show \
      --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
      --name "${{ vars.AZURE_VM_NAME }}" \
      --show-details \
      --query publicIps -o tsv)

    echo "VM_IP=$VM_IP" >> $GITHUB_ENV
- name: Generate Ansible Inventory
  run: |
    mkdir -p inventory

    cat > inventory/hosts.ini <<EOF
    [webservers]
    azure-vm ansible_host=${VM_IP} ansible_user=${{ secrets.VM_USERNAME }} ansible_password='${{ secrets.VM_PASSWORD }}' ansible_connection=ssh
    EOF
- name: Deploy Nginx
  run: |
    ansible-playbook \
      -i inventory/hosts.ini \
      playbooks/deploy-nginx.yml \
      --extra-vars "ansible_become_password=${{ secrets.VM_PASSWORD }}"
