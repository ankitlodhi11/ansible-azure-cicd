
name: Azure OIDC Ansible CI-CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 1: Azure OIDC Authentication
      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Step 2: Verify Azure
      - name: Verify Azure Connection
        run: |
          az account show --output table

      # Step 3: Install Ansible and sshpass
      - name: Install Ansible and SSH password support
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible sshpass

      # Step 4: Fetch Azure VM Public IP
      - name: Get Azure VM Public IP
        run: |
          VM_IP=$(az vm show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_VM_NAME }}" \
            --show-details \
            --query publicIps -o tsv)

          if [ -z "$VM_IP" ]; then
            echo "VM Public IP not found"
            exit 1
          fi

          echo "VM_IP=$VM_IP" >> "$GITHUB_ENV"

      # Step 5: Configure SSH
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$VM_IP" >> ~/.ssh/known_hosts

      # Step 6: Create Ansible Inventory
      - name: Generate Ansible Inventory
        env:
          VM_USER: ${{ secrets.VM_USERNAME }}
          VM_PASS: ${{ secrets.VM_PASSWORD }}
        run: |
          mkdir -p inventory

          cat > inventory/hosts.ini <<EOF
          [webservers]
          azure-vm ansible_host=${VM_IP} ansible_user=${VM_USER} ansible_password=${VM_PASS} ansible_connection=ssh
          EOF

      # Step 7: Validate Playbook
      - name: Validate Ansible Playbook
        run: |
          ansible-playbook \
            -i inventory/hosts.ini \
            playbooks/deploy-nginx.yml \
            --syntax-check

      # Step 8: Deploy Nginx
      - name: Deploy Nginx
        env:
          VM_PASS: ${{ secrets.VM_PASSWORD }}
        run: |
          ansible-playbook \
            -i inventory/hosts.ini \
            playbooks/deploy-nginx.yml \
            --extra-vars "ansible_become_password=$VM_PASS"

      # Step 9: Verify Deployment
      - name: Verify Nginx
        run: |
          curl --fail --retry 10 --retry-delay 3 \
            "http://${VM_IP}/"

          echo "Nginx deployment successful!"
