
name: Azure OIDC Ansible CI-CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Azure OIDC Login
      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 3. Verify Azure Connection
      - name: Verify Azure Connection
        run: |
          az account show --output table

      # 4. Install Ansible and SSH password support
      - name: Install Ansible and SSH password support
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible sshpass

      # 5. Verify Ansible
      - name: Verify Ansible Installation
        run: |
          ansible --version
          sshpass -V

      # 6. Get Azure VM Public IP
      - name: Get Azure VM Public IP
        run: |
          VM_IP=$(az vm show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_VM_NAME }}" \
            --show-details \
            --query publicIps -o tsv)

          if [ -z "$VM_IP" ]; then
            echo "ERROR: VM Public IP not found"
            exit 1
          fi

          echo "VM_IP=$VM_IP" >> "$GITHUB_ENV"
          echo "Azure VM Public IP fetched successfully"

      # 7. Configure SSH
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$VM_IP" >> ~/.ssh/known_hosts

      # 8. Generate Ansible Inventory
      - name: Generate Ansible Inventory
        env:
          VM_USER: ${{ secrets.VM_USERNAME }}
          VM_PASS: ${{ secrets.VM_PASSWORD }}
        run: |
          mkdir -p inventory

          cat > inventory/hosts.ini <<EOF
          [webservers]
          azure-vm ansible_host=${VM_IP} ansible_user=${VM_USER} ansible_password=${VM_PASS} ansible_connection=ssh ansible_ssh_common_args='-o StrictHostKeyChecking=yes'
          EOF

      # 9. Test SSH Connectivity
      - name: Test Ansible Connection
        run: |
          ansible webservers \
            -i inventory/hosts.ini \
            -m ping

      # 10. Validate Playbook
      - name: Validate Ansible Playbook
        run: |
          ansible-playbook \
            -i inventory/hosts.ini \
            playbooks/deploy-nginx.yml \
            --syntax-check

      # 11. Deploy Nginx
      - name: Deploy Nginx
        env:
          VM_PASS: ${{ secrets.VM_PASSWORD }}
        run: |
          ansible-playbook \
            -i inventory/hosts.ini \
            playbooks/deploy-nginx.yml \
            --extra-vars "ansible_become_password=$VM_PASS"

      # 12. Verify Nginx
      - name: Verify Nginx Deployment
        run: |
          curl --fail --retry 10 --retry-delay 3 \
            "http://${VM_IP}/"

          echo "Nginx deployment successful!"
