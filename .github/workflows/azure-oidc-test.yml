      - name: Test SSH Connectivity
        env:
          SSHPASS: ${{ secrets.VM_PASSWORD }}
          VM_USER: ${{ secrets.VM_USERNAME }}
        run: |
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            "$VM_USER@$VM_IP" \
            "echo SSH_CONNECTION_SUCCESSFUL && hostname && whoami"
